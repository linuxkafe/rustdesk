name: collect-build-log

on:
  workflow_run:
    workflows: ["linuxkafe-windows"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  collect-log:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create a comment on the commit
    steps:
      - name: Download build log artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-log
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read build log
        id: readlog
        run: |
          LOG=$(cat build.log | tail -n 300)
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post log as comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const log = `${{ steps.readlog.outputs.log }}`;
            const sha = '${{ github.event.workflow_run.head_sha }}';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `**Build failed – last 300 lines of build.log:**\n\`\`\`\n${log}\n\`\`\``
            });