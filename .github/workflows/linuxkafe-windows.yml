name: linuxkafe-windows

on:
  workflow_dispatch:
  push:
    branches: [master, linuxkafe-1.5.1]
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/hbb_common/**'
      - 'build.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/linuxkafe-windows.yml'

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  VCPKG_DEFAULT_TRIPLET: "x64-windows-static"

jobs:
  generate-bridge:
    name: Generate Flutter-Rust Bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Bridge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-for-windows:
    name: Build Windows x64
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Bridge Artifact
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          vcpkgArguments: 'libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static'

      - name: Set vcpkg include and lib paths
        run: |
          echo "CPATH=${{ github.workspace }}/vcpkg/installed/x64-windows-static/include;$CPATH" >> $GITHUB_ENV
          echo "LIB=${{ github.workspace }}/vcpkg/installed/x64-windows-static/lib;$LIB" >> $GITHUB_ENV
          echo "OPUS_INCLUDE_DIR=${{ github.workspace }}/vcpkg/installed/x64-windows-static/include" >> $GITHUB_ENV
          echo "OPUS_LIB_DIR=${{ github.workspace }}/vcpkg/installed/x64-windows-static/lib" >> $GITHUB_ENV
          echo "VPX_INCLUDE_DIR=${{ github.workspace }}/vcpkg/installed/x64-windows-static/include" >> $GITHUB_ENV
          echo "VPX_LIB_DIR=${{ github.workspace }}/vcpkg/installed/x64-windows-static/lib" >> $GITHUB_ENV

      - name: Prepare build log
        run: |
          cd "${{ github.workspace }}"
          touch build.log

      - name: Build rustdesk
        run: |
          cd "${{ github.workspace }}"
          python build.py --flutter 2>&1 | tee -a build.log
          echo "===== BUILD EXIT CODE: $? =====" >> build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
          retention-days: 30

      - name: Post build log as commit comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const tail = log.split('\n').slice(-300).join('\n');
            const sha = '${{ github.sha }}';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `**Build failed – last 300 lines of build.log:**\n\`\`\`\n${tail}\n\`\`\``
            });

      - name: Upload Windows artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-linuxkafe-windows
          path: |
            build/windows/x64/runner/Release/rustdesk.exe
            build/windows/x64/runner/Release/data/flutter_assets/assets/linuxkafe.svg
          retention-days: 30

